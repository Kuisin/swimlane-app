<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Swimlane Diagram Editor</title>
    <script>
      (function () {
        var base = "/swimlane-app/";
        var path = window.location.pathname;
        var route = "/";
        if (path.startsWith(base)) {
          route = path.slice(base.length - 1) || "/";
        } else if (path !== "/" && path !== base) {
          route = path;
        }
        var target =
          base.replace(/\/$/, "") +
          route +
          window.location.search +
          window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Loading…</p>
  </body>
</html>
