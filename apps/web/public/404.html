<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Swimlane Diagram Editor</title>
    <script>
      (function () {
        var base = "/swimlane-app/";
        var path = window.location.pathname;
        var route = "/";
        if (path.startsWith(base)) {
          route = path.slice(base.length - 1) || "/";
        } else if (path !== "/" && path !== base) {
          route = path;
        }
        var restorePath =
          route + window.location.search + window.location.hash;
        sessionStorage.setItem("swimlane-spa-redirect", restorePath);
        window.location.replace(base + "index.html");
      })();
    </script>
  </head>
  <body>
    <p>Loading…</p>
  </body>
</html>
