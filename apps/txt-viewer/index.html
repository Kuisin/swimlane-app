<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TxtViewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-title">TxtViewer</span>
    <div class="titlebar-actions">
      <button id="btn-open" class="btn-primary">Open Folder</button>
      <span id="folder-path" class="folder-path"></span>
    </div>
  </div>

  <div id="empty-state" class="empty-state">
    <div class="empty-icon">📂</div>
    <p>Select a folder containing <strong>.txt</strong> files to get started.</p>
    <button id="btn-open-empty" class="btn-primary">Open Folder</button>
  </div>

  <div id="grid" class="grid hidden"></div>

  <script src="renderer.js"></script>
</body>
</html>
